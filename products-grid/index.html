<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки товаров</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="products">
<div class="product">
        <img src="https://avatars.mds.yandex.net/get-mpic/14354979/2a00000196aa6600d509986ec0e2db5cc0f3/orig" alt="Товар 1">
        <h3>Беспроводные наушники</h3>
        <p>Наушники с активным шумоподавлением и чистым звуком.</p>
        <div class="product-footer">
            <span class="price">4 990 ₽</span>
            <button>Купить</button>
        </div>
    </div>
    <div class="product">
        <img src="https://a.allegroimg.com/original/2569bd/7b8eaf8a4de8ad4066f654ce45cb/T3229-Smartwatch-ZEGAREK-FITNESS-SMARTWATCH-ASUS-VIVOWATCH-BP" alt="Товар 2">
        <h3>Умные часы</h3>
        <p>Стильный гаджет с мониторингом пульса, шагомером и уведомлениями.</p>
        <div class="product-footer">
            <span class="price">8 990 ₽</span>
            <button>Купить</button>
        </div>
    </div>
    <div class="product">
        <img src="https://avatars.mds.yandex.net/i?id=2dd327f2132a5d74ab0cd618eb9a19ce4ecb424d-5234911-images-thumbs&n=13" alt="Товар 3">
        <h3>Портативная колонка</h3>
        <p>Мощный басс и до 12 часов автономной работы под рукой.</p>
        <div class="product-footer">
            <span class="price">3 500 ₽</span>
            <button>Купить</button>
        </div>
    </div>
</div>
</body>
</html>
